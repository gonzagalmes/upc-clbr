<style>/* iPhone con la app instalada: la banda oscura llega hasta arriba, detrás de la hora y la batería */
html{background:#151B23} body{min-height:100vh; background-color:#151B23!important; background-image:linear-gradient(var(--bg),var(--bg)); background-repeat:no-repeat; background-position:0 240px; background-size:100% 100%} .band{padding-top:calc(env(safe-area-inset-top) + 18px)} .band.tband .tgar{top:calc(env(safe-area-inset-top) + 16px)} .tscene,.tcruza{margin-top:calc(env(safe-area-inset-top) + 18px)}</style>

<script>
/* Si algo falla al arrancar, mostrarlo en pantalla (para diagnóstico) */
window.__bootErr=function(msg){ try{ var v=document.getElementById('view'); var t='⚠️ Error al iniciar: '+msg; if(v){ v.innerHTML='<div style="background:#fff;border:2px solid #E5484D;border-radius:12px;padding:16px;font:14px system-ui;color:#151B23;word-break:break-word">'+t.replace(/</g,'&lt;')+'<br><br>Mándale una captura de esto a quien administra la app.</div>'; } else { document.title=t; } }catch(e){} };
window.addEventListener('error',function(e){ window.__bootErr((e.message||'error')+' (línea '+(e.lineno||'?')+', col '+(e.colno||'?')+')'); });
window.addEventListener('unhandledrejection',function(e){ window.__bootErr('promesa: '+((e.reason&&e.reason.message)||e.reason)); });
setTimeout(function(){ if(!window.__appStarted) window.__bootErr('el código principal no arrancó en 20 s'); },20000);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
// tema: automático = oscuro de 20 a 8 h (o si el celular está en oscuro); se puede fijar en oscuro o claro
function temaPref(){ try{ return localStorage.getItem('upc-tema')||'auto'; }catch(e){ return 'auto'; } }
function aplicarTema(){ const p=temaPref(), h=new Date().getHours(), dev=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  const dark = p==='dark' || (p==='auto' && (h>=20 || h<8 || dev));
  document.documentElement.dataset.theme = dark?'dark':'light'; }
aplicarTema(); setInterval(aplicarTema, 60000);
</script>
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --raised:#E8ECF0; --line:#D5DBE2; --fg:#151B23; --dim:#5A6573;
  --ink:#141A22; --ink-2:#1E2631; --ink-fg:#F2F5F8; --ink-dim:#9AA6B4;
  --uci:#D93D44; --utia:#0E9C87; --utib:#2D78C4;
  --uci-t:#FBE7E8; --utia-t:#DDF3EF; --utib-t:#E0EBF7;
  --rojo:#E5484D; --rojo-bg:#FFE3E3; --amar:#9A7300; --amar-bg:#FFF1B8; --verde:#23864A; --verde-bg:#DCF3E3;
  --cel:#1D8FD1; --cel-bg:#D9EEFA; --cont-bg:#EDEFF2; --wk:#E3E7EC; --fest:#D9700B; --fest-bg:#FFE8D0;
  --me:#151B23; --me-fg:#FFFFFF;
  --f-disp:'Bricolage Grotesque', 'Arial Narrow', system-ui, sans-serif;
  --f-body:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --unit:var(--uci); --unit-t:var(--uci-t);
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E26; --raised:#212A35; --line:#2B3542; --fg:#E6EBF0; --dim:#94A1AF;
  --ink:#1A222C; --ink-2:#242E3A;
  --uci-t:#3A1D20; --utia-t:#123129; --utib-t:#16283C;
  --rojo-bg:#43191C; --cel-bg:#13304A; --amar:#EBC54E; --amar-bg:#3B3214; --verde:#56C77A; --verde-bg:#15321F;
  --cont-bg:#1F2731; --wk:#1D252F; --fest:#F2A04B; --fest-bg:#3A2614; --me:#F2F5F8; --me-fg:#0F1419; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:14px; line-height:1.45}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--unit); outline-offset:2px}
a{color:inherit}
.in{max-width:1220px; margin:0 auto; padding-left:16px; padding-right:16px}

.band{background:var(--ink); color:var(--ink-fg)}
.band .in{padding-block:18px 20px; display:flex; flex-direction:column; gap:16px}
.top{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px}
.brand{display:flex; align-items:center; gap:12px}
.logo{display:grid; grid-template-columns:repeat(3,10px); gap:3px}
.logo i{height:30px; border-radius:3px}
.brand h1{font-family:var(--f-disp); font-weight:800; font-size:30px; letter-spacing:-.02em; margin:0; line-height:1}
.brand p{margin:3px 0 0; color:var(--ink-dim); font-size:12.5px}
.who{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-dim)}
.who select{font:inherit; font-weight:600; color:var(--ink-fg); background:var(--ink-2); border:1px solid #344050; border-radius:9px; padding:8px 12px}
.nowhead{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; font-family:var(--f-body); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim)}
.live{width:9px; height:9px; border-radius:50%; background:#3DDC84; animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.8)} 70%{box-shadow:0 0 0 9px rgba(61,220,132,0)} 100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
#upcoming .btn{background:var(--ink); color:var(--ink-fg); border-color:#344050}
.livepill{white-space:nowrap; display:inline-flex; align-items:center; gap:7px; background:rgba(61,220,132,.14); color:#3DDC84; border:1px solid rgba(61,220,132,.55); border-radius:20px; padding:3px 10px 3px 8px; font-weight:600; letter-spacing:.12em}
.nowcards{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.nc{border-radius:12px; padding:12px 14px; color:#fff; display:flex; flex-direction:column; gap:6px; min-width:0}
.nc h4{margin:0; font-family:var(--f-disp); font-weight:800; font-size:20px; letter-spacing:-.01em}
.nc .r{display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:8px; align-items:baseline; font-size:15px}
.nc .r.nos{grid-template-columns:minmax(0,1fr) auto}
.nc .s{font-family:var(--f-body); font-size:11px; opacity:.8}
.nc .n{font-weight:700; overflow-wrap:anywhere}
.nc .h{font-family:var(--f-mono); font-size:11.5px; opacity:.9; white-space:nowrap}
.nc .h b{font-weight:700; background:rgba(255,255,255,.22); border-radius:5px; padding:0 5px; margin-left:4px}
.nc .rt{font-size:10px; font-weight:700; background:rgba(255,255,255,.25); border-radius:8px; padding:0 6px; margin-left:6px; vertical-align:1px}
.nc .nx{font-size:12.5px; border-top:1px solid rgba(255,255,255,.35); padding-top:6px; margin-top:2px; opacity:.95}
.nc .nx b{font-weight:700}
.nc.uci{background:var(--uci)} .nc.utia{background:var(--utia)} .nc.utib{background:var(--utib)}

.tabsbar{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5}
.tabs .tico{margin-right:6px}
@media (max-width: 760px){
  .tabsbar{position:fixed; top:auto; bottom:0; left:0; right:0; z-index:40; border-bottom:none; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .tabsbar .tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:0; overflow:visible; padding:0}
  .tabs button{position:relative; display:flex; flex-direction:column; align-items:center; gap:1px; padding:7px 2px 6px; font-size:11px; border-bottom:none; border-top:3px solid transparent}
  .tabs button[aria-selected="true"]{border-top-color:var(--fg)}
  .tabs .tico{font-size:22px; line-height:1; margin:0}
  .tabs .tlx{display:none}
  .tabs .cnt{position:absolute; top:3px; left:calc(50% + 6px); margin:0; font-size:10px; padding:0 5px; min-width:16px; text-align:center}
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
}
.tabs{display:flex; gap:2px; overflow-x:auto}
.tabs button{background:none; border:none; border-bottom:3px solid transparent; padding:12px 14px 10px; font-weight:600; color:var(--dim); white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg); border-bottom-color:var(--fg)}
.tabs .cnt{font-family:var(--f-mono); font-size:11px; background:var(--rojo); color:#fff; border-radius:10px; padding:1px 6px; margin-left:4px}

main.in{padding-block:18px 60px; display:flex; flex-direction:column; gap:16px}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.seg{display:flex; gap:6px; flex-wrap:wrap; width:100%; max-width:600px}
.seg button{flex:1 1 0; min-width:96px; border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:13px 18px; font-family:var(--f-disp); font-weight:800; font-size:20px; letter-spacing:-.01em; color:var(--dim)}
.seg button[data-u="uci"]{--c:var(--uci)} .seg button[data-u="utia"]{--c:var(--utia)} .seg button[data-u="utib"]{--c:var(--utib)}
.seg button:hover{border-color:var(--c); color:var(--c)}
.seg button.on{background:var(--c); border-color:var(--c); color:#fff}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chips button{border:1px solid var(--line); background:var(--surface); border-radius:22px; padding:8px 16px; font-size:14.5px; font-weight:600; color:var(--dim); text-transform:capitalize}
.modal .chips button{text-transform:none}
.chips button.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.chips button:disabled{opacity:.35; cursor:default}
.chips.years button{padding:4px 11px; font-size:12px; font-weight:500}
.chips.months{flex:1 1 auto; min-width:0; display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:6px; max-width:900px}
.chips.months button{border-radius:10px; padding:11px 2px; font-family:var(--f-disp); font-weight:800; font-size:16px; text-align:center}
.chips.months button.draft:not(.on){border-color:var(--amar); color:var(--amar)}
.yearrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.yearrow > span{font-family:var(--f-body); font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; width:40px}

.mhead{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; padding-bottom:10px; border-bottom:4px solid var(--unit)}
.mhead h2{font-family:var(--f-disp); font-weight:800; font-size:34px; letter-spacing:-.02em; margin:0; line-height:1; text-transform:capitalize}
.mhead .u{font-family:var(--f-disp); font-weight:800; font-size:34px; line-height:1; color:var(--unit)}
.badge{font-family:var(--f-body); font-size:11px; padding:4px 8px; border-radius:6px; background:var(--raised); color:var(--dim); align-self:center}
.badge.draft{background:var(--amar-bg); color:var(--amar)}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--dim); align-items:center}
.legend i{display:inline-block; width:16px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; border:1px solid var(--line)}
.tgl{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--dim)}

.cal{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px}
.wd{font-family:var(--f-disp); font-size:15px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 8px; text-align:center}
.wd.we{background:var(--wk)}
.day{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; min-width:0; display:flex; flex-direction:column}
.day.blank{background:transparent; border:none}
.day.wk{background:var(--wk)}
.day.fest{background:var(--fest-bg); border-color:var(--fest)}
.day.today{box-shadow:0 0 0 2px var(--fg)}
.dh{display:flex; align-items:baseline; gap:6px; padding:6px 8px 4px}
.dh b{font-family:var(--f-disp); font-weight:800; font-size:19px; line-height:1}
.dh .w{font-family:var(--f-body); font-size:10.5px; color:var(--dim); text-transform:uppercase; display:none}
.dh em{font-style:normal; font-size:10.5px; font-weight:700; color:var(--fest); margin-left:auto; text-align:right; line-height:1.15}
.day.fest .dh b{color:var(--fest)}
.sheet{display:flex; flex-direction:column; gap:1px; padding:0 4px 5px; flex:1 1 auto}
/* sectores y bloques se reparten la altura del día: así las líneas A/B quedan alineadas en toda la semana (finde con 2 bloques, semana con 3) */
.sheet > .sec{flex:1 1 0}
.sheet > .blks{flex:1 1 auto}
.blks > .blk{flex:1 1 auto; align-content:center}
.sec{display:grid; grid-template-columns:16px minmax(0,1fr); gap:3px; align-items:stretch}
.sec + .sec{margin-top:4px; padding-top:5px; border-top:2px solid var(--dim)}
.sl{display:flex; align-items:center; justify-content:center; font-family:var(--f-disp); font-weight:800; font-size:11px; color:var(--unit); background:var(--unit-t); border-radius:4px}
.blks{display:flex; flex-direction:column; gap:1px; min-width:0}
.blk{display:grid; grid-template-columns:38px minmax(0,1fr); gap:4px; align-items:start; text-align:left; border:1px solid transparent; background:none; border-radius:4px; padding:2px 4px; font-size:12.5px; line-height:1.3; width:100%; min-width:0}
.blk .h{font-family:var(--f-mono); font-size:10.5px; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; padding-top:1px}
.nms{display:flex; flex-direction:column; min-width:0}
.nm{font-weight:500; overflow-wrap:anywhere}
.nm i{font-style:normal; font-family:var(--f-mono); font-size:10px; color:var(--dim); margin-left:4px}
.nm.me{background:var(--me); color:var(--me-fg); font-weight:700; border-radius:4px; margin-left:-4px; padding:0 4px; width:fit-content}
.nm.me i{color:var(--me-fg); opacity:.75}
.blk.cont{background:var(--cont-bg)}
.blk.amarillo{background:var(--amar-bg)}
.blk.verde{background:var(--verde-bg)}
.blk.rojo{--g1:#E5484D; --g2:#F47478; --gs:rgba(229,72,77,.45); background:var(--rojo); border-color:var(--rojo); box-shadow:0 2px 8px rgba(229,72,77,.35)}
.blk.celeste{--g1:#1D8FD1; --g2:#4AAEE8; --gs:rgba(29,143,209,.35); background:var(--cel); border-color:var(--cel); box-shadow:0 2px 8px rgba(29,143,209,.35)}
.blk.celeste .nm{color:#fff; font-weight:700}
.blk.celeste .h{color:#fff; opacity:.9}
.blk .lab2{font-size:10.5px; font-weight:700; color:#fff; opacity:.95; line-height:1.2}
/* en la compu el celeste ya se explica con el color y la leyenda: sin texto extra, así no se desalinean los sectores */
@media (min-width: 761px){ .cal .blk .lab2{display:none} }
.blk.rojo .nm{color:#fff; font-weight:800; text-transform:uppercase; letter-spacing:.03em; font-size:11.5px}
.blk.rojo .h{color:#fff; opacity:.9}
.blk.rojo .nm.lab::after{content:" · anótate"; text-transform:none; font-weight:600; letter-spacing:0; opacity:.9}
.day.hasred{border:2px solid var(--rojo)}
.day.hascel:not(.hasred){border:2px solid var(--cel)}
@media (prefers-reduced-motion: no-preference){ .blk.rojo, .blk.celeste{animation:respira 1.6s ease-in-out infinite} }
@media (prefers-reduced-motion: reduce){ .live{animation:none} }
@keyframes respira{0%,100%{background:var(--g1); box-shadow:0 0 0 0 var(--gs)} 50%{background:var(--g2); box-shadow:0 0 0 3px var(--gs)}}
.blk.vacio{border:1px dashed var(--line)}
.blk.vacio .nm{color:var(--dim); font-style:italic; font-weight:400}
.blk.vacio.ref{border-color:var(--verde)}
button.blk:hover{border-color:var(--unit)}
.dimmed .day:not(.hasme):not(.blank):not(.hasred):not(.hascel){opacity:.32; filter:grayscale(1)}
.dimmed .blk:not(.mine):not(.rojo):not(.celeste){opacity:.35; filter:grayscale(1)}
.dimmed .day:not(.hasme).hasred .dh, .dimmed .day:not(.hasme).hascel .dh{opacity:.5}
.dimmed .day.hasme{border-color:var(--me); box-shadow:0 0 0 2px var(--me), 0 6px 18px rgba(0,0,0,.18); position:relative; z-index:1}
.dimmed .blk.mine{background:var(--me) !important; border-color:var(--me) !important; color:var(--me-fg) !important; box-shadow:0 2px 10px rgba(0,0,0,.25); opacity:1; filter:none}
.dimmed .blk.mine .h, .dimmed .blk.mine .nm, .dimmed .blk.mine i{color:var(--me-fg) !important; opacity:1}
.dimmed .blk.mine .nm.me{background:transparent}
.dimmed .blk.mine .nm:not(.me){opacity:.7}

.notes{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0}
.notes h3, .card h3{font-family:var(--f-disp); font-weight:800; font-size:18px; margin:0 0 10px; letter-spacing:-.01em}
.nlist{column-width:300px; column-gap:28px}
.nlist .nl{break-inside:avoid; -webkit-column-break-inside:avoid}
.nl{display:grid; grid-template-columns:62px minmax(0,1fr); gap:8px; font-size:13px; padding:4px 0; border-bottom:1px solid var(--line)}
.nl b{font-family:var(--f-body); font-size:11.5px; font-weight:600; color:var(--unit); padding-top:1px}
.nl.free{grid-template-columns:minmax(0,1fr)}
textarea{width:100%; min-height:170px; font:13px/1.55 var(--f-body); color:var(--fg); background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:10px}

.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 13px; font-weight:600; font-size:13px; text-decoration:none; display:inline-flex; align-items:center; gap:6px}
.btn.pri{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.btn.red{background:var(--rojo); color:#fff; border-color:var(--rojo)}
.btn.wa{background:#1FA855; border-color:#1FA855; color:#fff}
.btn.wa.ico{width:44px; height:44px; padding:0; border-radius:50%; display:inline-grid; place-items:center; flex:none !important; min-width:0}
.btn.wa.ico svg, .btn.wa.wai svg{width:24px; height:24px; fill:#fff}
.btn.sm.wa.ico, .cuoci .btn.wa.ico, .wki .btn.wa.ico{width:38px; height:38px}
.btn.wa.wai{display:inline-flex; align-items:center; gap:8px; font-weight:800}
.btn.sm{padding:5px 10px; font-size:12px}
.btn:disabled{opacity:.45; cursor:default}

.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; min-width:0}
.grid3{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:14px; align-items:start}
.stat{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.stat div{flex:1 1 140px; background:var(--raised); border-radius:10px; padding:10px 12px; font-family:var(--f-body); font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em}
.stat b{display:block; font-family:var(--f-disp); font-size:34px; font-weight:800; color:var(--fg); letter-spacing:-.02em; line-height:1.05}
.stat small{display:block; text-transform:none; letter-spacing:0; font-size:12px}
.list{display:flex; flex-direction:column}
.li{display:grid; grid-template-columns:86px 66px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px}
.li:first-child{border-top:none}
.li .d{font-weight:600}
.li .u{font-family:var(--f-disp); font-weight:800; font-size:12.5px; color:#fff; border-radius:6px; padding:2px 7px; text-align:center}
.li .hh{font-family:var(--f-mono); font-size:12.5px; font-variant-numeric:tabular-nums}
.li2{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
.li2:first-child{border-top:none}
.stat b, .pcount b, .cuor .cc{font-family:var(--f-mono)}
.sm-dim{font-family:var(--f-body); font-size:12px; color:var(--dim)}

<script>
window.__appStarted=true;
const APP_V='4.13.1';

// ================= memoria en la planilla (v4.6) =================
// En el iPhone, Safari borra la memoria del navegador de la app al cerrarse (la app vive dentro de un marco de Google).
// Lo que no debe repetirse (confeti, avisos, cumpleaños, tutorial, "!" ya vistos) se guarda también en la planilla
// (pestaña Memoria), por médico. El resto (tema, nombre, clave) sigue solo en el dispositivo.
const MEMO_RX=/^upc-(asado-luego|asado-av\||cumple|cuo-premio|cuo-aviso|tuto|mp-ok|rep-excl|cuo-rec\||anot-visto|disp-visto|finde-ok|sem-env|sem-visto)/;
let MEMO={}, MEMO_N='', MEMO_T=null, MEMO_CAMB={};
function memoCargar(n){
  n=n||''; if(n===MEMO_N && n) return Promise.resolve();
  MEMO_N=n; MEMO={}; MEMO_CAMB={}; if(!n) return Promise.resolve();
  const p=gsj('getMemo',n).then(o=>{ if(MEMO_N===n) MEMO=Object.assign(o||{}, MEMO); }).catch(()=>{});
  return Promise.race([p, new Promise(r=>setTimeout(r,5000))]);
}
function memoPut(k,v){
  if(!MEMO_N) return;
  if(v==null) delete MEMO[k]; else MEMO[k]=String(v);
  MEMO_CAMB[k]=v==null?null:String(v);
  const hoy=todayIso();   // los recordatorios de cuota por día no se acumulan
  Object.keys(MEMO).forEach(x=>{ if(x.indexOf('upc-cuo-rec|')===0 && x.indexOf('|'+hoy+'|')<0){ delete MEMO[x]; MEMO_CAMB[x]=null; } });
  clearTimeout(MEMO_T); MEMO_T=setTimeout(()=>{ const c=MEMO_CAMB, n=MEMO_N; MEMO_CAMB={}; if(Object.keys(c).length) gs('setMemo',n,JSON.stringify(c)).catch(()=>{}); },1500);
}
(function(){ try{
  const P=Storage.prototype, g=P.getItem, s=P.setItem, r=P.removeItem;
  const loc=t=>{ try{ return t===window.localStorage; }catch(e){ return false; } };
  P.getItem=function(k){ const v=g.call(this,k); if(loc(this) && MEMO_N && MEMO_RX.test(k) && MEMO[k]!=null) return MEMO[k]; return v; };
  P.setItem=function(k,v){ s.call(this,k,v); if(loc(this) && MEMO_RX.test(k)) memoPut(k,v); };
  P.removeItem=function(k){ r.call(this,k); if(loc(this) && MEMO_RX.test(k)) memoPut(k,null); };
}catch(e){} })();
// ================= constantes =================
const UNITS = {uci:'UCI', utia:'UTI A', utib:'UTI B'};
const UL = Object.keys(UNITS);
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WD = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const WDL = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const CONT = {uci:['Cabrales','Ramírez'], utia:['Bonaldy','López'], utib:['Sandoval','Silva']};

// ================= estado =================
let INIT = null;          // datos iniciales (públicos)
let ADMIN = null;         // datos del panel (con clave)
let PIN = null;
const MONTHS = {};        // MONTHS[ym] = {uci:{estado,days,notes}, ...}
const S = { tab:'cal', unit:'uci', ym:null, me:'', dim:false, editYm:null, mineYm:null, mineYear:null };
try{ S.me = localStorage.getItem('upc-soy') || ''; }catch(e){}

// ================= utilidades =================
const $ = s=>document.querySelector(s);
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// llamadas al servidor: si Google no contesta en 60 s, se corta con un error claro (antes quedaba "Cargando…" para siempre)
const GS_PEND=new Map(); let GS_ID=0;
function gs(fn,...args){ return new Promise((res,rej)=>{ const id=++GS_ID; GS_PEND.set(id,{fn,t:Date.now()});
  const fin=f=>v=>{ if(!GS_PEND.has(id)) return; GS_PEND.delete(id); clearTimeout(to); f(v); };
  const to=setTimeout(fin(rej).bind(null,new Error(`el servidor no respondió a "${fn}" en 60 s`)),60000);
  google.script.run.withSuccessHandler(fin(res)).withFailureHandler(fin(rej))[fn](...args); }); }
function gsPendTxt(){ const now=Date.now(); return [...GS_PEND.values()].map(x=>`${x.fn} (${Math.round((now-x.t)/1000)} s)`).join(', '); }
async function gsj(fn,...args){ return JSON.parse(await gs(fn,...args)); }
function errMsg(e){ return String((e&&e.message)||e||'algo falló').replace(/^Error:\s*/,''); }
let tt; function toast(t,err){ const el=$('#toast'); el.textContent=t; el.className=err?'err':''; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true, err?6000:2800); }
function openModal(html,wide){ const m=$('#modal'); m.className='modal'+(wide?' wide':''); m.innerHTML=html; $('#ovl').hidden=false; }
function closeModal(){ $('#ovl').hidden=true; }
$('#ovl').addEventListener('click', e=>{ if(e.target.id==='ovl') closeModal(); });
async function copy(t){ try{ await navigator.clipboard.writeText(t); toast('Copiado ✓'); }catch(e){ toast('Selecciona el texto y cópialo a mano'); } }

function pad(n){ return String(n).padStart(2,'0'); }
function ym(y,m){ return `${y}-${pad(m)}`; }
function ymAdd(k,n){ const [y,m]=k.split('-').map(Number); const d=new Date(y,m-1+n,1); return ym(d.getFullYear(),d.getMonth()+1); }
function isoOf(k,d){ return String(d)==='x1' ? `${ymAdd(k,1)}-01` : `${k}-${pad(d)}`; }   // 'x1' = día 1 del mes siguiente mostrado al final del mes
function dow(i){ return new Date(i+'T12:00').getDay(); }
function addDays(i,n){ const d=new Date(i+'T12:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dayNum(i){ const [y,m,d]=i.split('-').map(Number); return Date.UTC(y,m-1,d)/864e5; }
function fmtD(i){ const d=new Date(i+'T12:00'); return `${WD[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`; }
function todayIso(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const OLD_LBL={'día':'8 a 21','dia':'8 a 21','noche':'21 a 8','am':'8 a 21','pm':'21 a 8','refuerzo':'9 a 14'};
function hrs(h){ h=OLD_LBL[String(h||'').trim().toLowerCase()]||h; const m=String(h||'').match(/^(\d+)\s*a\s*(\d+)$/); if(!m) return null; let a=+m[1], b=+m[2]; if(b<=a) b+=24; return [a,b]; }
function hshort(h){ const r=hrs(h); return r?`${r[0]}–${r[1]%24}`:String(h||''); }
function monthName(k){ return `${MESES[+k.slice(5)-1]} ${k.slice(0,4)}`; }
function festivos(){ return INIT ? INIT.festivos : {}; }
function idxNow(){ return (ADMIN&&ADMIN.idx) || INIT.idx; }
function allYms(){ const s=new Set(); UL.forEach(u=>(idxNow()[u]||[]).forEach(k=>s.add(k))); return [...s].sort(); }
function isDraft(k){ const m=MONTHS[k]; return !!m && UL.some(u=>m[u] && m[u].estado!=='publicado'); }
function setUnitVars(u){ document.documentElement.style.setProperty('--unit',`var(--${u})`); document.documentElement.style.setProperty('--unit-t',`var(--${u}-t)`); }
function nom(n){ const L=(ADMIN&&ADMIN.medicos)||(INIT&&INIT.medicos)||[]; const m=L.find(x=>x.n===n); return (m&&m.nom)||n; }
// en las listas desplegables: apellido primero ("Pina, Juan Manuel"), ordenado por apellido
function apeNom(n){ const f=String(nom(n)).trim().split(/\s+/); return f.length<2 ? f.join(' ') : `${f[f.length-1]}, ${f.slice(0,-1).join(' ')}`; }
function porApellido(L){ return [...L].sort((a,b)=>apeNom(a).localeCompare(apeNom(b),'es')); }
function normTxt(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\./g,'').toLowerCase().trim().replace(/\s+/g,' '); }
// Convierte un nombre escrito a mano ("Jimenez", "Julián Jiménez") al médico de la lista ("Jiménez")
function canonDoc(t){
  const L=(ADMIN&&ADMIN.medicos)||[], x=normTxt(t); if(!x) return t;
  let m=L.find(d=>normTxt(d.n)===x||normTxt(d.nom)===x);
  if(!m){ const w=x.split(' '); const c=L.filter(d=>{ const s=normTxt(d.n).split(' ')[0]; return w.includes(s); }); if(c.length===1) m=c[0]; else if(c.length>1) m=c.find(d=>normTxt(d.nom).split(' ').every(p=>w.includes(p)))||null; }
  return m?m.n:t;
}
function phoneOf(n){ const m=ADMIN&&ADMIN.medicos.find(x=>x.n===n); return m?m.cel:''; }

async function loadMonth(k, force){
  if(!force && MONTHS[k]) return MONTHS[k];
  MONTHS[k] = await gsj('getMonth', k, PIN);
  return MONTHS[k];
}
// tramos individuales de un bloque (cada médico con su horario)
function segs(u,i,b){ return (b.m||[]).map(p=>{ const r=hrs(p.h||b.h); return r?{n:p.n,u,i,s:b.s||null,a:r[0],z:r[1],ref:!!b.r}:null; }).filter(Boolean); }
function forEachBlock(k, fn){ const M=MONTHS[k]; if(!M) return; UL.forEach(u=>{ const mo=M[u]; if(!mo) return; Object.entries(mo.days).forEach(([d,bl])=>bl.forEach((b,x)=>fn(u,isoOf(k,+d),b,x,d))); }); }

// ================= de turno ahora =================
// turnos de una persona desde ayer hasta dentro de N días, juntando bloques seguidos
function upcomingRuns(who, days){
  const t=todayIso(), out=[];
  for(let k=-1;k<=days;k++){ const i=addDays(t,k), M=MONTHS[i.slice(0,7)]; if(!M) continue;
    UL.forEach(u=>{ const mo=M[u]; if(!mo) return; (mo.days[String(+i.slice(8))]||[]).forEach(b=>segs(u,i,b).forEach(s=>{ if(s.n===who) out.push(s); })); }); }
  const now=new Date(), nowAbs=dayNum(t)*24+now.getHours()+now.getMinutes()/60;
  return mergeRuns(out).map(r=>({...r, A:dayNum(r.i)*24+r.a, Z:dayNum(r.i)*24+r.a+r.horas})).filter(r=>r.Z>nowAbs && r.A<dayNum(t)*24+(days+1)*24).sort((a,b)=>a.A-b.A).map(r=>({...r, now:r.A<=nowAbs}));
}
function whenTxt(r){
  const t=todayIso(), d=dayNum(r.i)-dayNum(t);
  if(r.now) return {big:'AHORA', cls:'hoy'};
  if(d===0) return {big:'HOY', cls:'hoy'};
  if(d===1) return {big:'MAÑANA', cls:'man'};
  return {big:fmtD(r.i), cls:'', sub:`en ${d} días`};
}
function renderUpcoming(){
  const box=$('#upcoming'); if(!box) return;
  if(!S.me || !INIT){ box.hidden=true; return; }
  const R=upcomingRuns(S.me,15);
  const row=r=>{ const w=whenTxt(r); return `<div class="up ${w.cls}"><span class="upw">${esc(w.big)}${w.sub?`<small>${esc(w.sub)}</small>`:''}</span><span class="u" style="background:var(--${r.u})">${UNITS[r.u]}${r.s?' '+esc(r.s):''}</span><span class="uph">${r.a} a ${r.fin} · ${r.horas===24?'24 h':r.horas+' h'}</span><button class="upq" data-uq="${r.i}" title="¿Quién está ese día?" aria-label="Quién está el ${fmtD(r.i)}">👥</button></div>`; };
  box.innerHTML=`<div class="upc"><div class="uphd"><b>Tus próximos turnos</b><span>${esc(nom(S.me))} · próximos 15 días</span></div>
    ${R.length?R.slice(0,4).map(row).join('')+(R.length>4?`<button class="btn sm" id="upMore">Ver los ${R.length} en Mis turnos</button>`:''):'<div class="upnone">No tienes turnos en los próximos 15 días.</div>'}</div>`;
  const ab=asadoBanner(); if(ab) box.insertAdjacentHTML('afterbegin', ab);
  const cb=cumpleBanner(); if(cb) box.insertAdjacentHTML('afterbegin', cb);
  if(dispPideMe()) box.insertAdjacentHTML('afterbegin', `<div class="dvban"><span class="ic">🗓️</span><span style="flex:1"><b>Confirma tu disponibilidad de ${MESES[+INIT.disp.ym.slice(5)-1].toLowerCase()}</b><br><span class="sm">Revisa tus turnos habituales y avísanos si alguno no puedes · hasta el ${fmtD(INIT.disp.hasta)}</span></span><button class="btn pri" id="dispGo">Confirmar</button></div>`);
  const cq=miCuota(); if(cq&&cq.deudaTot) box.insertAdjacentHTML('beforeend', `<div class="cuoban alarma" role="alert"><span class="emo mal">${cuoMood(cq).e}</span><span style="flex:1;min-width:180px"><b>Debes ${cq.deudaTot} ${plural(cq.deudaTot,'cuota','cuotas')} del fondo</b> · ${money(cq.deudaTot*INIT.cuo.monto)}</span><button class="btn sm pay" id="cuoPayB">Pagar ahora</button><button class="btn sm" id="cuoGo">Ver detalle</button></div>`);
  else if(cq && !(cq.prev&&cq.prev.deuda)){ const md=cuoMood(cq); box.insertAdjacentHTML('beforeend', `<div class="cuoban premio"><span class="emo ok">${md.e}</span><span style="flex:1;min-width:180px"><b>${md.b}</b></span><button class="btn sm" id="cuoGo">Ver</button></div>`); }
  if(+todayIso().slice(8)<=7) box.insertAdjacentHTML('beforeend', premiosCard());
  box.hidden=false;
  const cpb=$('#cuoPayB'); if(cpb) cpb.onclick=pagoModal;
  const cy=$('#cumYo'); if(cy) cy.onclick=()=>cumplePop(true);
  const ag=$('#asGo'); if(ag) ag.onclick=()=>asadoPop(true);
  const cg=$('#cuoGo'); if(cg) cg.onclick=()=>{ S.tab='mine'; render().then(()=>{ const c=$('#cuoCard'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); }); };
  const dg=$('#dispGo'); if(dg) dg.onclick=()=>miDispModal(INIT.disp.ym);
  box.querySelectorAll('[data-uq]').forEach(b=>b.onclick=()=>quienModal(b.dataset.uq));
  const m=$('#upMore'); if(m) m.onclick=()=>{ S.tab='mine'; S.mineYm=INIT.ymNow; render(); };
}
function renderNow(){
  renderUpcoming();
  const now=new Date(), ti=todayIso(), nowAbs=dayNum(ti)*24+now.getHours()+now.getMinutes()/60;
  $('#nowWhen').textContent = `${WD[now.getDay()]} ${now.getDate()}/${now.getMonth()+1} · ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const base0=dayNum(ti)*24+8-(now.getHours()<8?24:0);   // el "día de turno": de 8 a 8
  const hhs=(A,Z)=>`${A%24}–${Z%24}`;
  $('#nowCards').innerHTML = UL.map(u=>{
    // tramos de ayer, hoy y mañana; se juntan los seguidos de la misma persona (Reyes 8–16 + 16–8 = 24 h)
    const all=[];
    [-1,0,1].forEach(k=>{ const i=addDays(ti,k), M=MONTHS[i.slice(0,7)]; const bl=(M&&M[u]&&M[u].days[String(+i.slice(8))])||[];
      bl.forEach(b=>segs(u,i,b).forEach(x=>all.push({...x, A:dayNum(i)*24+x.a, Z:dayNum(i)*24+x.z}))); });
    all.sort((p,q)=>p.A-q.A);
    const runs=[];
    all.forEach(x=>{ const r=runs.find(r=>r.n===x.n && Math.abs(r.Z-x.A)<.01); if(r){ r.Z=x.Z; r.ref=r.ref||x.ref; } else runs.push({n:x.n, s:x.s, A:x.A, Z:x.Z, ref:x.ref}); });
    // si todavía no entró nadie del día nuevo (ej: domingo 8:30 y el finde entra a las 9), se muestra el día anterior
    let fin0=base0; if(!runs.some(r=>r.A>=fin0 && r.A<fin0+24 && r.A<=nowAbs)) fin0-=24; const W1=fin0+24;
    // los del día de turno + los que vienen de antes y siguen (aparecen como "sigue …", no abren tramo)
    const R=runs.filter(r=>(r.A>=fin0 && r.A<W1) || (r.A<fin0 && r.Z>Math.max(nowAbs,fin0)));
    if(!R.length) return `<div class="nc ${u}"><div class="uh"><h4>${UNITS[u]}</h4></div><div class="pd"><div class="pl">—</div><div></div></div></div>`;
    // un tramo nuevo empieza cada vez que entra alguien: si nadie entra, el tramo sigue (Bonaldy 8–21 = "Día")
    const Ts=[...new Set(R.filter(r=>r.A>=fin0).map(r=>r.A))].sort((p,q)=>p-q); if(!Ts.length) Ts.push(fin0); const fins=[...Ts.slice(1), Math.max(...R.map(r=>r.Z), W1)];
    const nom2=(A,Z)=>{ const a=((A%24)+24)%24, L=Z-A; if(L>=20) return ['🕐','24 h']; if(a>=19||a<5) return ['🌙','Noche']; if(a>=12) return Z%24>=5&&Z%24<=10&&L>10?['🌇','Tarde y noche']:['🌇','Tarde']; return (Z-dayNum(ti)*24)%24>=17||L>9?['☀️','Día']:['☀️','Mañana']; };
    const P=Ts.map((T,k)=>{ const E=fins[k], ent=R.filter(r=>r.A===T).sort((p,q)=>String(p.s||'').localeCompare(String(q.s||''))||(q.ref?-1:0)), sig=R.filter(r=>r.A<T && r.Z>T);
      const cls=E<=nowAbs?'past':(T<=nowAbs?'now':''), [em,lb]=nom2(T,E);
      return `<div class="pd ${cls}"><div class="pl">${em} ${lb}<small>${hhs(T,E)}</small></div><div>${ent.map(r=>`<div class="pr${r.Z<=nowAbs&&cls==='now'?' off':''}"><span>${r.s?`<span class="s">${esc(r.s)}</span>`:''}${esc(r.n)}${r.ref?'<span class="rt">refuerzo</span>':''}</span><span class="hh">${hhs(r.A,r.Z)}</span></div>`).join('')}${sig.length?`<div class="sg">↪ ${sig.map(r=>`${r.s?esc(r.s)+' ':''}sigue ${esc(r.n)}${r.Z<E?` (hasta las ${r.Z%24})`:''}`).join(' · ')}</div>`:''}</div></div>`; });
    const nx=[...new Set(runs.map(r=>r.A))].sort((p,q)=>p-q).find(T=>T>nowAbs);
    return `<div class="nc ${u}"><div class="uh"><h4>${UNITS[u]}</h4>${nx!=null&&nx<W1+2?`<small>cambia a las ${nx%24}</small>`:''}</div>${P.join('')}</div>`;
  }).join('');
  const nc=$('#nowCards'), dots=$('#nowDots');
  if(nc && dots && !nc.dataset.w){ nc.dataset.w=1; nc.addEventListener('scroll',()=>{ const k=Math.round(nc.scrollLeft/(nc.scrollWidth-nc.clientWidth||1)*2); dots.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===k)); },{passive:true}); }
}

// ================= planilla =================
function blkHtml(b,u,i,x,mode){
  const cls=['blk', b.e, (b.r&&b.e==='vacio')?'ref':'', S.me&&(b.m||[]).some(p=>p.n===S.me)?'mine':''];
  let names;
  if(b.m&&b.m.length) names=b.m.map(p=>`<span class="nm${p.n===S.me?' me':''}">${esc(p.n)}${p.h?`<i>${hshort(p.h)}</i>`:''}</span>`).join('')+(b.e==='celeste'?'<span class="lab2">busca reemplazo</span>':'');
  else names=`<span class="nm lab">${b.e==='rojo'?'Por cubrir':(b.r?'Refuerzo':'Por asignar')}</span>`;
  const inner=`<span class="h">${esc(hshort(b.h))}</span><span class="nms">${names}</span>`;
  const mio = mode==='view' && S.me && (b.m||[]).some(p=>p.n===S.me) && i>=todayIso();
  const click = mode==='edit' || (mode==='view' && esAbierto(b)) || mio;
  const c=cls.filter(Boolean).join(' ');
  return click ? `<button class="${c}" data-i="${i}" data-x="${x}" data-u="${u}">${inner}</button>` : `<div class="${c}">${inner}</div>`;

function dayHtml(u,i,bl,mode){

// ---------- plantilla de cada día: esquema de la semana + rotación de fines de semana ----------
function rotFinde(u, i){
  const R=ADMIN&&ADMIN.rot, w=dow(i); if(!R||!R[u]||(w!==6&&w!==0)) return null;
  const sat = w===6 ? i : addDays(i,-1), n=R[u].ciclo.length, k=Math.round((dayNum(sat)-dayNum(R.ref))/7);
  const W=R[u].ciclo[(((k+R[u].k0)%n)+n)%n]; return w===6 ? W.sat : W.sun;
}
function DL(mo,d){ return String(d)==='x1' ? ((mo.ext&&mo.ext['1'])||[]) : mo.days[String(d)]; }
function plantillaDia(u, i){ return rotFinde(u,i) || (ADMIN.esquema[u][String(dow(i))]||[]); }
// dueño original de un bloque según la plantilla (para "Ernesto por Rojas" aunque antes haya habido otro cambio)
function dueno(u, i, b, pos){
  try{ const r=hrs(b.h); if(!r) return '';
    const L=plantillaDia(u,i).filter(t=>(t.s||'')===(b.s||'') && !t.r === !b.r), igual=L.filter(t=>t.h===b.h);
    // dos bloques iguales (ej: 8 a 14 Bonaldy y 8 a 14 López): el que tenga a uno de sus médicos, si no por orden
    const mios=(b.m||[]).map(p=>p.n);
    const t=igual.find(t=>(t.m||[]).some(p=>mios.includes(p.n))) || igual[Math.min(pos||0, igual.length-1)] || L.find(t=>{ const q=hrs(t.h); return q && q[0]<=r[0] && q[1]>r[0]; });
    return t ? ((t.m||[]).map(p=>p.n).join(' / ') || 'libre') : '';
  }catch(e){ return ''; }
}

  const cls=(r,c)=>top[c]!==undefined && val(r,c)>0 && val(r,c)>=top[c] ? 'hi' : '';
  openModal(`<h3>Equidad de turnos</h3><div class="sub" style="text-transform:none">${esc(P[2])}${ADMIN.role==='jefe'?' · incluye borradores':''} · en <span style="color:var(--fest)">naranja</span>, los 3 que más cargan cada columna</div>${chips}
    <div style="overflow-x:auto"><table class="eqt"><tr><th data-sk="nom">Médico</th>${cols.map(([c,l])=>`<th data-sk="${UL.includes(c)?'h':c}">${l}${sortK===c?' ▾':''}</th>`).join('')}</tr>
    ${rows.map(r=>`<tr><td><b>${esc(r.nom)}</b></td>${cols.map(([c])=>`<td class="${cls(r,c)}">${c==='h'?`<span class="eqbar" style="width:${Math.round(r.h/mx*60)}px"></span>`:''}${val(r,c)||'—'}</td>`).join('')}</tr>`).join('')}
    <tr class="avg"><td>Promedio</td>${cols.map(([c])=>`<td>${Math.round(avg(c)*10)/10}</td>`).join('')}</tr></table></div>
    <p class="hint" style="margin:0">Noches = turnos que cruzan la medianoche. Cambios = bloques en amarillo tomados. Toca un título para ordenar.</p>
    <div class="mrow"><button class="btn" id="mX">Cerrar</button></div>`, true);
  wireChips(); $('#mX').onclick=closeModal;
  $('#modal').querySelectorAll('[data-sk]').forEach(th=>th.onclick=()=>{ S.eqSort=th.dataset.sk; equidadModal(per); });
}

// ================= 💬 WhatsApp con ventanita (v4.8) =================
// Todos los botones de WhatsApp abren primero esta ventanita: mensaje editable, Copiar, número y Abrir WhatsApp.
// Sirve en la compu del trabajo, que no tiene WhatsApp. Lo que hace cada botón al tocarlo (ej: marcar "ya le avisé") sigue igual.
document.addEventListener('click',e=>{ const a=e.target&&e.target.closest&&e.target.closest('a[href^="https://wa.me/"]'); if(!a||a.hasAttribute('data-wa-directo')) return; e.preventDefault(); waHoja(a.href); },true);
function telBonito(t){ const d=String(t||'').replace(/\D/g,''); return d.length===11&&d.startsWith('569')?`+56 9 ${d.slice(3,7)} ${d.slice(7)}`:(d?'+'+d:''); }
function waHoja(href){
  let tel='', txt=''; try{ const u=new URL(href); tel=u.pathname.replace(/\D/g,''); txt=u.searchParams.get('text')||''; }catch(e){}
  const med=tel&&ADMIN&&(ADMIN.medicos||[]).find(m=>m.cel===tel), quien=med?nom(med.n):(tel?'':'un grupo o chat');
  const compu=(()=>{ try{ return matchMedia('(pointer:fine)').matches && innerWidth>=700; }catch(e){ return false; } })();
  let o=$('#waOvl'); if(!o){ o=document.createElement('div'); o.id='waOvl'; document.body.appendChild(o); o.addEventListener('click',ev=>{ if(ev.target===o) o.hidden=true; }); }
  o.hidden=false;
  o.innerHTML=`<div class="wash" role="dialog" aria-label="Mensaje para WhatsApp">
    <div class="wahd">${WA_SVG}<div><b>Mensaje para WhatsApp</b><br><span class="sm-dim">${quien?'Para '+esc(quien):''}${tel?(quien?' · ':'Para ')+telBonito(tel):''}</span></div></div>
    <textarea id="waTxt" class="inp" rows="8" aria-label="Mensaje">${esc(txt)}</textarea>
    <div class="wabt"><button class="btn pri" id="waCp">📋 Copiar mensaje</button>${tel?`<button class="btn" id="waTel">📞 Copiar número</button>`:''}</div>
    <div class="wabt"><a class="btn${compu?'':' wa'}" data-wa-directo id="waApp" target="_blank" rel="noopener">${WA_SVG}<span>${compu?'App de WhatsApp':'Abrir WhatsApp'}</span></a><button class="btn" id="waX">Cerrar</button></div></div>`;
  const upd=()=>{ const t=$('#waTxt').value; $('#waApp').href=`https://wa.me/${tel}?text=${encodeURIComponent(t)}`; };
  upd(); $('#waTxt').oninput=upd;
  $('#waCp').onclick=()=>copy($('#waTxt').value);
  const tb=$('#waTel'); if(tb) tb.onclick=()=>copy(telBonito(tel));
  $('#waX').onclick=()=>{ o.hidden=true; };
  $('#waApp').onclick=()=>setTimeout(()=>{ o.hidden=true; },300);
}

const FECHA_LARGA=i=>`${WDL[dow(i)]} ${+i.slice(8)} de ${MESES[+i.slice(5,7)-1].toLowerCase()}`;
function asadoVivo(){ const A=INIT.asado; return A && A.ev && todayIso()<=A.ev.fecha ? A : null; }
function asadoInv(){ const A=INIT.asado, ex=(A&&A.ev&&A.ev.excluir)||[]; return (INIT.medicos||[]).map(m=>m.n).filter(n=>!ex.includes(n)); }
function asadoInvitado(){ return !!S.me && asadoInv().includes(S.me); }
function asadoMia(){ const A=asadoVivo(); return A && S.me ? (A.resp||{})[S.me] : null; }
function asadoGente(r){ return 1+(+r.a||0)+(+r.k||0); }
function asadoResumen(){ const A=asadoVivo()||INIT.asado; if(!A) return null;
  const inv=asadoInv(), R=A.resp||{}, X=A.ext||{}, xs=Object.keys(X);
  const si=inv.filter(n=>R[n]&&R[n].v==='si'), no=inv.filter(n=>R[n]&&R[n].v==='no'), falta=inv.filter(n=>!R[n]);
  const xsi=xs.filter(n=>X[n].v==='si'), xno=xs.filter(n=>X[n].v!=='si'), van=[...si.map(n=>R[n]),...xsi.map(n=>X[n])];
  const ad=van.reduce((s,r)=>s+(+r.a||0),0), ni=van.reduce((s,r)=>s+(+r.k||0),0);
  return {si,no,falta,xsi,xno,ad,ni,adTot:van.length+ad,tot:van.reduce((s,r)=>s+asadoGente(r),0)}; }
function asadoAcomp(r){ const a=+r.a||0, k=+r.k||0; if(!a&&!k) return 'solo'; return [a?`${a} ${plural(a,'adulto')}`:'', k?`${k} ${plural(k,'niño')}`:''].filter(Boolean).join(' y '); }

function tocarBloque(k,u,d,x){
  const b=DL(MONTHS[k][u],d)[x];
  if(b.e==='rojo' || esRefLibre(b) || (b.e==='celeste' && !(b.m||[]).some(p=>p.n===S.me))){ signModal(k,u,d,x); return; }
  const r=myRuns(k,S.me).find(r=>r.u===u && r.bl.some(z=>+z.i.slice(8)===d && z.x===x));
  if(!r) return;
  const est=reemplazoHtml(k,r,0);
  const tit=`${fmtD(r.i)} · ${UNITS[u]}${r.s?' sector '+esc(r.s):''} · ${r.a} a ${r.fin} (${r.horas} h)`;
  if(est.includes('data-rq')){ cambioModal(r); return; }
  if(est.includes('data-undo')){ deshacerModal(r); return; }
  if(!r.cur && est.includes('buscando')){ cambioModal(r, true); return; }
  openModal(`<h3>Tu turno</h3><div class="sub">${tit}</div>
    <p class="hint" style="margin:0">${r.cur?'Este turno ya empezó.':est.includes('buscando')?'Este turno está publicado como <b style="color:var(--cel)">busca reemplazo</b>. Sigue siendo tuyo hasta que la jefatura lo asigne a otro médico. Si ya no necesitas el reemplazo, avísale a la jefatura.':est.includes('pedido')?'Ya pediste reemplazo para este turno. La jefatura tiene que aprobarlo.':'Este mes todavía no está publicado.'}</p>
    <div class="mrow"><button class="btn" id="mX">Cerrar</button></div>`);
  $('#mX').onclick=closeModal;
}
function solKey(x){ return `${x.i.slice(0,7)}|${x.u}|${+x.i.slice(8)}|${x.x}`; }
function reemplazoHtml(k,r,j){
  if(r.past || !r.bl || !r.bl.length || (r.cur && !futurosDe(r).length)) return '';
  const M=MONTHS[k]&&MONTHS[k][r.u]; if(!M || M.estado!=='publicado') return '';
  if(r.bl.some(x=>x.b.e==='celeste')) return '<span class="tag cel">buscando reemplazo</span>';
  if(r.bl.some(x=>(INIT.sols||[]).includes(solKey(x)))) return `<span class="tag cel">reemplazo pedido</span><button class="lnk" style="font-size:12px; margin-left:6px" data-undo="${j}">Deshacer</button>`;
  return ` <button class="lnk" style="font-size:12px; margin-left:6px" data-rq="${j}">Cambio o reemplazo</button>`;
}

function icsDate(i,h){ const [y,m,d]=i.split('-').map(Number); const t=new Date(Date.UTC(y,m-1,d)+h*3600e3); return `${t.getUTCFullYear()}${pad(t.getUTCMonth()+1)}${pad(t.getUTCDate())}T${pad(t.getUTCHours())}${pad(t.getUTCMinutes())}00`; }
function icsText(runs, who){

function decoHoy(iso){
  const q=new URLSearchParams(location.search), f=q.get('deco')||S.decoForzar;
  if(f&&TEMPS[f]) return {id:f,...TEMPS[f]};
  const md=iso.slice(5), Y=+iso.slice(0,4), pq=pascuaIso(Y), en=(a,b)=>md>=a&&md<=b;
  let id='';
  if(md==='12-03') id='medico';
  else if(iso===addDays(pq,-2)||iso===addDays(pq,-1)) id='santo';
  else if(iso===pq) id='pascua';
  else if(en('12-26','12-31')||en('01-01','01-02')) id='anionuevo';
  else if(en('12-01','12-25')) id='navidad';
  else if(en('01-03','01-06')) id='reyes';
  else if(en('01-07','02-29')) id='verano';
  else if(en('04-30','05-01')) id='trabajo';
  else if(en('05-19','05-21')) id='navales';
  else if(en('06-19','06-24')) id='pueblos';
  else if(en('09-01','09-20')) id='patrias';
  else if(en('10-24','10-31')) id='halloween';
  else if(en('11-01','11-02')) id='todossantos';
  const C=id?{id,...TEMPS[id]}:{id:''};
  if(id==='santo') C.sal=iso===addDays(pq,-2)?'Viernes Santo':'Sábado Santo';
  if(id==='todossantos'&&md==='11-02'){ C.sal='Día de los Fieles Difuntos'; }
  const fest=(INIT.festivos||{})[iso]||'';
  const D=DIAS.find(d=>(fest&&d.re.test(fest))||d.md===md);
  if(D&&id!=='todossantos'){ C.id=C.id||'dia'; C.ico=C.ico||'🙏'; C.sal=D.sal; C.sub=D.sub||''; C.art=D.art; C.meta=null; C.especial=1; }
  if(fest&&!D&&!/santo|navidad|año nuevo|independencia|ej[eé]rcito|glorias navales|trabajo|pueblos/i.test(fest)) C.extra=fest;
  return C;
}

function decoTxt(){ const p=decoPref(); return p==='off'?'Decoración apagada':p==='quieta'?'Decoración sin animación':'Decoración con animación'; }
function decoBtn(){ const C=decoHoy(decoFecha()); if(!C.id) return ''; return `<button class="whoref" id="whoDeco" title="${decoTxt()} (toca para cambiar)" aria-label="${decoTxt()}">${decoPref()==='off'?'⚪':C.ico}</button>`; }

      :`<p class="hint" style="margin:0">Se arma con el esquema habitual: fijos de lunes a viernes, fines de semana vacíos y festivos con entrada a las 9.</p>
        <div class="row" style="justify-content:flex-start"><input type="month" id="newYm" class="inp" style="width:auto" value="${A.next}"><button class="btn pri" id="crear">Crear en borrador</button></div>`}

// ---------- choques y fatiga ----------
// Usa los meses cargados (el editado, el anterior y el siguiente) de las 3 unidades.
function allSegs(override){
  const out=[], ov=override, ovKey=ov?`${ov.k}|${ov.u}|${ov.d}|${ov.x}`:'';
  // ¿este bloque es el que se está editando? (el 1/1 puede editarse desde diciembre como 'x1' o desde enero como día 1)
  const esOv=(k,u,d,x)=>!!ov && ov.u===u && ov.x===x && ((ov.k===k && String(ov.d)===String(d)) || (String(ov.d)==='x1' && ymAdd(ov.k,1)===k && String(d)==='1') || (String(d)==='x1' && ymAdd(k,1)===ov.k && String(ov.d)==='1'));
  const add=(k,u,i,b,x,d)=>{ const o=esOv(k,u,d,x), bb=o?ov.b:b, key=o?ovKey:`${k}|${u}|${d}|${x}`;
    segs(u,i,bb).forEach(s=>out.push({...s, A:dayNum(i)*24+s.a, Z:dayNum(i)*24+s.z, key})); };
  Object.keys(MONTHS).forEach(k=>{
    forEachBlock(k,(u,i,b,x,d)=>add(k,u,i,b,x,d));
    UL.forEach(u=>{ const mo=MONTHS[k][u], ext=mo&&mo.ext&&mo.ext['1']; if(!ext) return;
      const nx=MONTHS[ymAdd(k,1)]; if(nx&&nx[u]&&nx[u].days&&nx[u].days['1']) return;   // si enero ya está cargado, manda enero (es la misma copia)
      ext.forEach((b,x)=>add(k,u,isoOf(k,'x1'),b,x,'x1')); });
  });
  return out;
}
function absTxt(A){ const dn=Math.floor(A/24), h=A-dn*24; const dt=new Date(dn*864e5); return `${WD[dt.getUTCDay()]} ${dt.getUTCDate()}/${dt.getUTCMonth()+1} ${h}h`; }
function findIssues(segsAll, names, onlyKey){
  const res=[];
  names.forEach(n=>{
    const L=segsAll.filter(s=>s.n===n).sort((a,b)=>a.A-b.A);
    for(let a=0;a<L.length;a++) for(let c=a+1;c<L.length;c++){
      if(L[c].A>=L[a].Z) break;
      if(onlyKey && L[a].key!==onlyKey && L[c].key!==onlyKey) continue;
      res.push({id:`sup|${n}|${L[a].A}-${L[a].Z}|${L[c].A}-${L[c].Z}`, n, A:L[a].A, segs:[L[a],L[c]],
        targets:[{u:L[a].u,i:L[a].i},{u:L[c].u,i:L[c].i}],
        t:`${nom(n)} queda superpuesto: ${UNITS[L[a].u]} ${absTxt(L[a].A)}–${L[a].Z%24}h y ${UNITS[L[c].u]} ${absTxt(L[c].A)}–${L[c].Z%24}h.`});
    }
    const runs=[];
    L.forEach(s=>{ const r=runs[runs.length-1]; if(r && s.A<=r.Z+0.01){ r.Z=Math.max(r.Z,s.Z); r.us.add(s.u); r.keys.push(s.key); r.segs.push(s); } else runs.push({A:s.A,Z:s.Z,us:new Set([s.u]),keys:[s.key],segs:[s]}); });
    runs.forEach(r=>{
      if(onlyKey && !r.keys.includes(onlyKey)) return;
      const H=r.Z-r.A, units=[...r.us].map(x=>UNITS[x]).join(' + ');
      const seen=new Set(), targets=r.segs.filter(x=>{ const k=x.u+x.i; if(seen.has(k)) return false; seen.add(k); return true; }).map(x=>({u:x.u,i:x.i}));
      const id=`run|${n}|${r.A}-${r.Z}`;
      if(H>25) res.push({id, n, A:r.A, targets, segs:r.segs, t:`${nom(n)} queda ${H} h seguidas (${absTxt(r.A)} → ${absTxt(r.Z)}) · ${units}.`});
      else if(r.us.size>1 && H>12) res.push({id, n, A:r.A, targets, segs:r.segs, w:true, t:`${nom(n)} queda ${H} h seguidas entre dos unidades (${units}): ${absTxt(r.A)} → ${absTxt(r.Z)}.`});
    });
  });
  return res.sort((x,y)=>x.A-y.A);
}
// WhatsApp al médico de una alerta: solo los turnos involucrados y el total de horas
function fatigaMsg(t){
  // un renglón por día y unidad (8–16 + 16–21 + 21–8 del mismo día = "8 a 8 · 24 h")
  const runs=[]; [...t.segs].sort((x,y)=>x.A-y.A).forEach(s=>{ const r=runs.find(r=>r.i===s.i && r.u===s.u && r.s===s.s && Math.abs(r.Z-s.A)<.01); if(r) r.Z=s.Z; else runs.push({i:s.i,u:s.u,s:s.s,a:s.a,A:s.A,Z:s.Z}); });
  runs.forEach(r=>{ r.horas=r.Z-r.A; r.fin=(r.a+r.horas)%24; });
  const A=Math.min(...t.segs.map(s=>s.A)), Z=Math.max(...t.segs.map(s=>s.Z));
  return `¡Hola, ${nom(t.n)}! Estos turnos tuyos en el calendario:\n`+runs.map(r=>'• '+runTxt(r)).join('\n')+`\nTotal: ${Z-A} h seguidas.`;
}
function waFat(t){ if(!t.segs || !t.n) return ''; const tel=phoneOf(t.n); return tel?`<a class="btn wa ico" target="_blank" rel="noopener" href="https://wa.me/${tel}?text=${encodeURIComponent(fatigaMsg(t))}" title="WhatsApp a ${esc(nom(t.n))}" aria-label="WhatsApp a ${esc(nom(t.n))}">${WA_SVG}</a>`:'<span class="sm-dim">sin celular en la planilla</span>'; }
function acked(id){ return !!(ADMIN && ADMIN.acks && ADMIN.acks.includes(id)); }
function issuesFor(k,u,d,x,nb){
  const key=`${k}|${u}|${d}|${x}`;
  const names=[...new Set(nb.m.map(p=>p.n))], i=isoOf(k,d);
  const disp=nb.m.map(p=>{ const r=hrs(p.h||nb.h)||[]; const q=dispNo(p.n,i,r[0],r[1]); return q?{id:`disp|${p.n}|${i}`, w:true, t:`${nom(p.n)} marcó que ${DISPTXT[q]} el ${fmtD(i)}.`}:null; }).filter(Boolean);
  return [...disp, ...findIssues(allSegs({k,u,d,x,b:nb}), names, key)].filter(t=>!acked(t.id));
}
function issuesOfMonth(k){
  const all=allSegs(null), names=[...new Set(all.filter(s=>s.i.startsWith(k)).map(s=>s.n))];
  return [...findIssues(all.filter(s=>s.i>=addDays(k+'-01',-1) && s.i<=addDays(ymAdd(k,1)+'-01',0)), names, null)
    .filter(t=>t.targets.some(x=>x.i.startsWith(k))), ...dispIssues(k)].sort((x,y)=>x.A-y.A);
}
function renderDock(k){

// ---------- recordatorio del finde ----------
function mergeRuns(list){
  const abs=list.map(s=>({...s, A:dayNum(s.i)*24+s.a, Z:dayNum(s.i)*24+s.z})).sort((p,q)=>p.A-q.A);
  const runs=[];
  // se juntan los bloques seguidos del mismo día (8–16 + 16–21 + 21–8 = 24 h); un bloque de otro día va en su propio renglón
  abs.forEach(s=>{ const r=runs.find(r=>r.i===s.i && r.u===s.u && r.s===s.s && Math.abs(r.Z-s.A)<.01); if(r){ r.Z=s.Z; } else runs.push({...s}); });
  return runs.map(r=>({i:r.i, u:r.u, s:r.s, a:r.a, horas:r.Z-r.A, fin:(r.a+(r.Z-r.A))%24}));
}
function runTxt(r,sinSector){ return `${fmtD(r.i)} · ${UNITS[r.u]}${r.s&&!sinSector?' '+r.s:''} · ${r.horas===24?'24 h':r.horas+' h'} (${r.a} a ${r.fin})`; }

  await Promise.all([...new Set(dias.map(i=>i.slice(0,7)))].map(ym=>loadMonth(ym).catch(()=>{})));

  const out={}, runs=[];

function repProponer(){

  // devuelve '' si puede; {m, blando} si no (blando = solo si no hay otro: extender un 24 h de sábado con el refuerzo del domingo)
  const libre=(n,A,Z,esRef)=>{ const L=(busy[n]||[]);
    const ch=L.find(([a,z])=>A<z&&Z>a); if(ch) return {m: ch[2]===2?'ya lo elegiste en otro turno a esa hora':ch[2]?'ya sugerido en otro turno a esa hora':'choca con otro turno'};
    const all=[...L,[A,Z]].sort((p,q)=>p[0]-q[0]); let a=null,z=null,len=0;
    all.forEach(([p,q])=>{ if(z!==null && p<=z+0.01){ z=Math.max(z,q); } else { if(a!==null && A>=a && Z<=z) len=z-a; a=p; z=q; } });
    if(A>=a && Z<=z) len=z-a;
    if(len<=25) return '';
    return (esRef && len<=30) ? {m:`quedaría ${len} h seguidas (excepción)`, blando:true} : {m:`quedaría ${len} h seguidas`}; };
  filas.forEach(f=>{ f.sel=S.repSel[repKey(f)]||''; f.sug=''; f.exc=false; f.motivo={}; });
  filas.filter(f=>f.sel).forEach(f=>sumar(f.sel,f.i.slice(0,7),f.A,f.Z,2));
  const conElegido=JSON.parse(JSON.stringify(horas));
  filas.filter(f=>!f.sel).sort((f,g)=>(f.c.length?0:1)-(g.c.length?0:1) || f.c.length-g.c.length || f.A-g.A).forEach(f=>{ const ym=f.i.slice(0,7), blandos=[];
    f.c.forEach(n=>{ if(excl.has(n)){ f.motivo[n]='lo sacaste de la sugerencia'; return; } const dq=dispNo(n,f.i,f.A-dayNum(f.i)*24,f.Z-dayNum(f.i)*24); if(dq){ f.motivo[n]='marcó que '+DISPTXT[dq]; return; } const r=libre(n,f.A,f.Z,!!f.b.r); if(r){ f.motivo[n]=r.m; if(r.blando) blandos.push(n); } });
    const porHoras=L=>L.sort((x,y)=>((horas[ym]||{})[x]||0)-((horas[ym]||{})[y]||0) || apeNom(x).localeCompare(apeNom(y),'es'));
    const ok=porHoras(f.c.filter(n=>!f.motivo[n]));
    f.sug=ok[0]||'';
    if(!f.sug && blandos.length){ f.sug=porHoras(blandos)[0]; f.exc=true; }   // nadie más: se extiende excepcionalmente
    if(f.sug) sumar(f.sug,ym,f.A,f.Z,1); });
  return {antes:S.repBase.horas, conElegido, conSug:horas};
}

function repEsCompu(){ try{ return matchMedia('(pointer:fine)').matches && innerWidth>=1100; }catch(e){ return false; } }
// ¿puede n tomar el turno f? '' si sí; si no, el motivo (superposición o más de 25 h seguidas), contando lo ya elegido
function repChoca(n,f){
  const L=((S.repBase.busy||{})[n]||[]).map(x=>[x[0],x[1]]);
  S.repBase.filas.forEach(g=>{ if(g!==f && S.repSel[repKey(g)]===n) L.push([g.A,g.Z]); });
  if(L.some(([a,z])=>f.A<z&&f.Z>a)) return 'choca con otro turno suyo';
  const all=[...L,[f.A,f.Z]].sort((p,q)=>p[0]-q[0]); let a=null,z=null,len=0;
  all.forEach(([p,q])=>{ if(z!==null&&p<=z+0.01) z=Math.max(z,q); else { if(a!==null&&f.A>=a&&f.Z<=z) len=z-a; a=p; z=q; } });
  if(f.A>=a&&f.Z<=z) len=z-a;
  return len>25?`quedaría ${len} h seguidas`:'';
}

function repBoardCerrar(){ const o=$('#repBoard'); if(o) o.hidden=true; document.body.classList.remove('rbopen'); }
function repKey(f){ return `${f.p.ym}|${f.p.u}|${f.p.d}|${f.p.x}`; }
function repOpciones(f){
  const sel=(S.repSel||{})[repKey(f)] || '';
  const otros=porApellido((ADMIN.medicos||[]).filter(m=>m.on).map(m=>m.n).filter(n=>!f.c.includes(n)));

async function repAsignarTodo(F){
  const elegidos=F.map(f=>({f, n:(S.repSel||{})[repKey(f)] || ''})).filter(z=>z.n);
  if(!elegidos.length){ toast('No elegiste a nadie',true); return; }
  // agrupa por día y unidad: una sola llamada por día
  const G={}; elegidos.forEach(z=>{ const k=`${z.f.p.ym}|${z.f.p.u}|${z.f.p.d}`; (G[k]=G[k]||[]).push(z); });
  openModal(`<h3>Asignando…</h3><div class="sub" id="repProg">0 de ${elegidos.length}</div>`);
  let hechos=0; const errores=[], porMed={};
  for(const [k,L] of Object.entries(G)){
    const [ym,u,dd]=k.split('|'), d=dd==='x1'?'x1':+dd, i=isoOf(ym,d), dia=dd==='x1'?`${+i.slice(8)}/${+i.slice(5,7)}`:+dd;
    const items=[], notas=[];
    L.forEach(({f,n})=>{ const b=f.b, r=hrs(b.h), antes=(b.m||[]).map(p=>p.n).join(' / ')||dueno(u,i,b,(()=>{ try{ const dl=DL(MONTHS[ym][u],d)||[]; return dl.slice(0,f.p.x).filter(bb=>bb.h===b.h&&(bb.s||'')===(b.s||'')&&!bb.r===!b.r).length; }catch(e){ return 0; } })())||'libre';
      items.push({x:f.p.x, blk:{h:b.h, m:[{n}], e:b.r?'verde':'amarillo', p:[]}});
      notas.push(`${WDL[dow(i)]} ${dia}: ${n} por ${antes} (${r[0]}-${r[1]%24})`);
      (porMed[n]=porMed[n]||[]).push({i,u,s:f.p.s||'',a:r[0],fin:r[1]%24,horas:r[1]-r[0]}); });
    try{ Object.assign(MONTHS[ym], await gsj('adminSaveBlocks',PIN,ym,u,d,items,notas)); hechos+=L.length; }
    catch(e){ errores.push(`${fmtD(i)} ${UNITS[u]}: ${errMsg(e)}`); }
    const pr=$('#repProg'); if(pr) pr.textContent=`${hechos} de ${elegidos.length}`;
  }

// ---------- crear / publicar / borrar mes ----------
function ajustesFestivo(f, on){
  // devuelve [{k,u,changes:{d:[h...]}}] con los horarios a cambiar el día festivo y el anterior
  const res=[], prev=addDays(f,-1), w=dow(f);
  [[f,'dia'],[prev,'prev']].forEach(([i,kind])=>{
    const k=i.slice(0,7), M=MONTHS[k]; if(!M) return;
    UL.forEach(u=>{ const mo=M[u]; if(!mo) return; const bl=mo.days[String(+i.slice(8))]; if(!bl) return;
      let ch=null;
      bl.forEach((b,j)=>{ let h=null;
        if(kind==='dia'){ if(on && /^8 a/.test(b.h)) h=b.h.replace(/^\d+/,'9'); if(!on && w>0 && w<6 && /^9 a/.test(b.h) && !b.r) h=b.h.replace(/^\d+/,'8'); }
        else { const r=hrs(b.h); if(r&&r[1]>24){ if(on && /a 8$/.test(b.h)) h=b.h.replace(/\d+$/,'9'); if(!on && w>0 && w<6 && /a 9$/.test(b.h)) h=b.h.replace(/\d+$/,'8'); } }
        if(h){ ch=ch||[]; ch[j]=h; } });
      if(ch) res.push({k,u,changes:{[String(+i.slice(8))]:ch}});
    });
  });
  return res;
}

async function agregarExt(k){
  const i=isoOf(ymAdd(k,1),1), fest=festivos()[i]||(i.endsWith('-01-01')?'Año Nuevo':'');
  openModal(`<h3>Agregar el ${fmtD(i)} al final de ${monthName(k)}</h3><div class="sub">En las 3 unidades, con el esquema habitual${fest?' de festivo (entrada a las 9)':''}.</div>
    <p class="hint" style="margin:0">• Lo editas aquí como cualquier día. Los médicos lo ven al final de ${MESES[+k.slice(5)-1]}, pero no pueden tocarlo.<br>• Cuando crees ${MESES[+i.slice(5,7)-1]}, el día 1 sale copiado de aquí, y desde ahí lo que cambies en uno se cambia en el otro.${fest?`<br>• La noche del ${fmtD(isoOf(k,new Date(+k.slice(0,4),+k.slice(5),0).getDate()))} pasa a terminar a las 9 donde hoy termina a las 8.`:''}</p>
    <div class="mrow"><button class="btn" id="mX">Cancelar</button><button class="btn pri" id="xOk">Agregar</button></div>`);
  $('#mX').onclick=closeModal;
  $('#xOk').onclick=async()=>{ const b=$('#xOk'); b.disabled=true; b.textContent='Agregando…';
    try{
      for(const u of UL){ if(MONTHS[k][u]&&MONTHS[k][u].ext) continue;
        const bl=JSON.parse(JSON.stringify(plantillaDia(u,i))).map(x=>({...x,p:[]}));
        if(fest) bl.forEach(x=>{ if(/^8 a/.test(x.h)) x.h=x.h.replace(/^\d+/,'9'); });
        Object.assign(MONTHS[k], await gsj('adminSetExt',PIN,k,u,bl)); }
      if(fest) for(const a of ajustesFestivo(i,true).filter(a=>a.k===k)){ try{ Object.assign(MONTHS[k], await gsj('adminPutDays',PIN,a.k,a.u,a.changes)); }catch(e){} }
      closeModal(); render(); toast(`${fmtD(i)} agregado ✓`);
    }catch(e){ toast('No se pudo: '+errMsg(e),true); b.disabled=false; b.textContent='Agregar'; } };
}
async function crearMes(k){
  if(!/^\d{4}-\d{2}$/.test(k||'')) { toast('Elige el mes', true); return; }
  if(!ADMIN.esquema){ toast('Falta el esquema habitual en la planilla (pestaña Config).', true); return; }
  const btn=$('#crear'); if(btn){ btn.disabled=true; btn.textContent='Creando…'; }
  try{
    const [y,m]=k.split('-').map(Number), nd=new Date(y,m,0).getDate();
    MONTHS[k]=MONTHS[k]||{};
    for(const u of UL){
      const days={};
      for(let d=1; d<=nd; d++){ days[String(d)]=JSON.parse(JSON.stringify(plantillaDia(u, isoOf(k,d)))).map(b=>({...b,p:[]})); }
      MONTHS[k][u]={estado:'borrador', days, notes:[]};
    }
    await loadMonth(ymAdd(k,-1)).catch(()=>{});
    // festivos del mes: entrada a las 9 y noche anterior hasta las 9
    const extra=[];
    Object.keys(festivos()).filter(f=>f.startsWith(k)).forEach(f=>ajustesFestivo(f,true).forEach(a=>{
      if(a.k===k) Object.entries(a.changes).forEach(([d,ch])=>ch.forEach((h,j)=>{ if(h) MONTHS[k][a.u].days[d][j].h=h; }));
      else extra.push(a);
    }));
    for(const u of UL) Object.assign(MONTHS[k], await gsj('adminPutMonth',PIN,k,u,MONTHS[k][u].days,false));
    for(const a of extra){ try{ Object.assign(MONTHS[a.k], await gsj('adminPutDays',PIN,a.k,a.u,a.changes)); }catch(e){} }
    ADMIN=Object.assign(ADMIN, await gsj('login',PIN));
    S.editYm=k; render(); toast(`${monthName(k)} creado en borrador`);
  }catch(e){ delete MONTHS[k]; toast('No se creó: '+errMsg(e), true); render(); }
}

function loadScript(src){ return new Promise((res,rej)=>{ const t=document.createElement('script'); t.src=src; t.onload=res; t.onerror=()=>rej(new Error('bloqueado')); document.head.appendChild(t); setTimeout(()=>rej(new Error('tiempo')),15000); }); }
async function descargar(k,u,tipo){

  }catch(e){ toast('No se pudo cargar la herramienta de descarga (¿red bloqueada?). Prueba desde el celular.', true); return; }

}

function guardarPin(v){ try{ localStorage.setItem('upc-pin2', JSON.stringify({v, exp:Date.now()+30*864e5})); }catch(e){} try{ sessionStorage.setItem('upc-pin',v); }catch(e){} }
function leerPin(){ try{ const o=JSON.parse(localStorage.getItem('upc-pin2')||'null'); if(o&&o.v&&o.exp>Date.now()) return o.v; }catch(e){} try{ return sessionStorage.getItem('upc-pin'); }catch(e){ return null; } }

// ---------- se actualiza sola: cada minuto, al volver a la app, o con el botón ↻ ----------
let REFRESCANDO=false;
async function refrescar(manual){
  if(!INIT || REFRESCANDO) return;
  if(!manual){ if(document.hidden || !$('#ovl').hidden) return; const a=document.activeElement; if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; }
  REFRESCANDO=true;
  try{
    const antes={}; (INIT.pend||[]).forEach(p=>{ antes[`${p.ym}|${p.u}|${p.d}|${p.x}`]=p.p||[]; });
    const pend=await gsj('getPendientes');
    const nuevos=[]; pend.forEach(p=>{ const a=antes[`${p.ym}|${p.u}|${p.d}|${p.x}`]; if(a) (p.p||[]).forEach(n=>{ if(!a.includes(n)) nuevos.push(`${nom(canonDoc(n))} · ${fmtD(pendIso(p))} ${UNITS[p.u]} ${p.h}`); }); });
    INIT.pend=pend;
    const ks=new Set([todayIso().slice(0,7), S.ym, S.mineYm, ...(ADMIN?[S.editYm, S.editYm&&ymAdd(S.editYm,1), S.editYm&&ymAdd(S.editYm,-1)]:[])].filter(k=>k&&MONTHS[k]));
    for(const k of ks){ try{ MONTHS[k]=await gsj('getMonth',k,PIN); }catch(e){} }
    if(ADMIN){ try{ ADMIN.sols=await gsj('adminSols',PIN); }catch(e){} if(ADMIN.role==='jefe') try{ const cb=await gsj('adminCambios',PIN); if(cb.length>(ADMIN.camb||[]).length && manual===false) setTimeout(()=>toast('🔄 Hay un cambio entre médicos para visar'),300); ADMIN.camb=cb; }catch(e){} }
    if(!manual && (!$('#ovl').hidden || /INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))) return;   // empezó a editar mientras tanto
    const y=window.scrollY; await render(); window.scrollTo(0,y);
    if(nuevos.length) toast('🙋 Se anotó: '+nuevos.slice(0,2).join(' · ')+(nuevos.length>2?` y ${nuevos.length-2} más`:''));
    else if(manual) toast('Actualizado ✓');
  }catch(e){ if(manual) toast('No se pudo actualizar: '+errMsg(e),true); }
  finally{ REFRESCANDO=false; }
}
setInterval(()=>refrescar(false), 300000);   // cada 5 min (además, al volver a la app)
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refrescar(false); });

async function boot(){
  const slow=setTimeout(()=>{ if(!INIT) $('#view').innerHTML='<div class="card empty">Está tardando más de lo normal… Si sigues viendo esto, recarga la página o prueba desde el celular con datos móviles (algunas redes bloquean Google).<br><br><button class="btn pri" onclick="location.reload()">Recargar</button></div>'; }, 25000);
  try{
    INIT=await gsj('getInit'); clearTimeout(slow);
    Object.entries(INIT.months).forEach(([k,v])=>{ MONTHS[k]=v; });
    if(!S.me){ const y=await leerUrlYo(); if(y && INIT.medicos.some(m=>m.n===y)){ S.me=y; try{ localStorage.setItem('upc-soy',y); }catch(e){} } }
    else urlYo(S.me);
    fillWho();
    try{ decoIniciar(); }catch(e){ console.warn('deco',e); }
    const memoP=memoCargar(S.me);
    const avP=S.me?Promise.race([gsj('misAvisos',S.me).catch(()=>[]), new Promise(r=>setTimeout(()=>r([]),5000))]):Promise.resolve([]);
    $('#foot').textContent=`UPC CLBR · versión ${APP_V}`+(INIT.v===APP_V?'':` · ⚠️ Index.html y Code.gs no coinciden (servidor ${INIT.v||'anterior a 2.7'}): pega los dos de la misma versión e implementa de nuevo`);
    await cargarMiDisp(); await memoP; S.avisos=await avP;
    let pin=leerPin();
    if(pin){ try{ ADMIN=await gsj('login',pin); PIN=pin; Object.keys(MONTHS).forEach(k=>delete MONTHS[k]); INIT.festivos=Object.fromEntries(ADMIN.festAll.filter(f=>f.on).map(f=>[f.f,f.n])); await preloadNow(); }catch(e){ ADMIN=null; PIN=null; } }
    render();
    preloadNow();
    setTimeout(()=>avisoCuota(),600);
    setTimeout(()=>{ try{ pushIniciar(); }catch(e){} },3500);
    setTimeout(()=>cargarPremios(),900);
    setTimeout(()=>pingUso(),1500);
    let skip=false; try{ skip=!!localStorage.getItem('upc-soy-skip'); }catch(e){}
    if(!S.me && !skip) pickName();
  }catch(e){
    $('#view').innerHTML=`<div class="card empty">No se pudieron cargar los turnos: ${esc(errMsg(e))}<br><br><button class="btn pri" onclick="location.reload()">Reintentar</button></div>`;
  }
}
setInterval(renderNow, 60000);
boot();
</script>
